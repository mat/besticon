name: Build + Test

on:
  push:
    branches: [ master ]
    paths-ignore:
      - Readme.markdown
  pull_request:
    branches: [ master ]
    paths-ignore:
      - Readme.markdown

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.x
      uses: actions/setup-go@v6
      with:
        go-version: ^1.27

    - name: Check out code into the Go module directory
      uses: actions/checkout@v5

    - name: Build
      run: go get github.com/mat/besticon/...

    - run: make test

    - run: make test_bench

    - run: make test_race
