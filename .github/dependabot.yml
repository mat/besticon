version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "semiannually"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "quarterly"
    groups:
      go-modules:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "semiannually"
    allow:
      - dependency-name: "alpine"
